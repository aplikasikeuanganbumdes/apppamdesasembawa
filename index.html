<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Viewport sangat penting agar aplikasi pas di layar HP dan tidak bisa di-zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUM Desa Amanah Sembawa</title>
    <style>
        /* Reset CSS agar tidak ada margin putih di pinggir layar */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Mencegah scroll ganda */
            background-color: #ffffff;
        }

        /* Styling untuk Iframe agar full screen responsif */
        iframe {
            display: block;
            width: 100vw; /* 100% lebar viewport */
            height: 100vh; /* 100% tinggi viewport */
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
        }
    </style>
</head>
<body>

    <!-- 
      Catatan: Script Google Apps Script terkadang memblokir akses jika dibuka di dalam Iframe 
      pada aplikasi mobile tertentu karena alasan keamanan (X-Frame-Options).
      Jika layar putih, solusinya adalah menggunakan konfigurasi server URL di Capacitor, 
      bukan Iframe.
    -->
    <iframe 
        src="https://script.google.com/macros/s/AKfycbyu6Qq5nx7_vgAh6QbNY7PywM9cLS4umM7S53NbziG1Ff7MRJ3O3vo5nOUCrGlHAfbkYg/exec"
        allowfullscreen>
    </iframe>

</body>
</html>
